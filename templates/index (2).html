<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heart Disease Prediction</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Heart Disease Risk Predictor</h1>
  <form action="/predict" method="post">
    <label>Age: <input type="number" name="age" required></label><br>
    <label>Sex (1 = male, 0 = female): <input type="number" name="sex" required></label><br>
    <label>Chest Pain Type (cp): <input type="number" name="cp" required></label><br>
    <label>Resting BP (trestbps): <input type="number" name="trestbps" required></label><br>
    <label>Cholesterol (chol): <input type="number" name="chol" required></label><br>
    <label>Fasting Blood Sugar (fbs): <input type="number" name="fbs" required></label><br>
    <label>Resting ECG (restecg): <input type="number" name="restecg" required></label><br>
    <label>Max Heart Rate (thalach): <input type="number" name="thalach" required></label><br>
    <label>Exercise Angina (exang): <input type="number" name="exang" required></label><br>
    <label>Oldpeak: <input type="number" step="0.1" name="oldpeak" required></label><br>
    <label>Slope: <input type="number" name="slope" required></label><br>
    <label>CA: <input type="number" name="ca" required></label><br>
    <label>Thal: <input type="number" name="thal" required></label><br><br>
    <button type="submit">Predict</button>
  </form>
</body>
</html>
